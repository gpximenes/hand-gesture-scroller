[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hand-gesture-scroller"
version = "1.0.0"
description = "Safety-first, local hand gesture desktop controller"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Gabriel Ximenes"}]
dependencies = []

[project.optional-dependencies]
desktop = ["mediapipe>=0.10.18,<0.11", "opencv-contrib-python>=4.10,<5", "PyAutoGUI>=0.9.54,<1", "Pillow>=10,<13"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
gesture-scroller = "hand_gesture_scroller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hand_gesture_scroller"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
